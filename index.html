<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moved — NixPHP is now NAF</title>
<link rel="canonical" href="https://nafphp.github.io/docs/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="3; url=https://nafphp.github.io/docs/">
<style>
  :root { color-scheme: light dark; --ink:#262c31; --dim:#5c666e; --bg:#fbfbfa; --accent:#0e8874; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e6e9ec; --dim:#9aa5ad; --bg:#1b1f22; --accent:#2fc3a8; } }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         display:grid; place-items:center; min-height:100vh; padding:2rem; box-sizing:border-box; }
  main { max-width:34rem; }
  h1 { font-size:1.5rem; line-height:1.25; margin:0 0 .75rem; }
  p { margin:0 0 1rem; color:var(--dim); }
  a { color:var(--accent); }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.9em; }
  .go { display:inline-block; margin-top:.5rem; padding:.6rem 1.1rem; border-radius:6px;
        background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>NixPHP is now NAF</h1>
  <p>The documentation moved to <strong>nafphp.github.io/docs</strong>. Taking you there…</p>
  <p>The Composer vendor is <code>naf/…</code>, the namespace <code>Naf\</code>, and the CLI
     binary <code>naf</code>. The
     <a href="https://nafphp.github.io/docs/upgrading-from-nixphp/">upgrade guide</a>
     covers the move in one page.</p>
  <a class="go" id="go" href="https://nafphp.github.io/docs/">Open the documentation</a>
</main>
<script>
(function () {
  // Every chapter of the old site has a successor; send deep links to theirs
  // rather than dropping everybody on the front page.
  var MAP = {
    best_practices: 'best-practices', configuration: 'configuration', controllers: 'controllers',
    database: 'database', dependency_injection: 'dependency-injection', error_handling: 'errors',
    events: 'events', external_libraries: 'external-libraries', file_downloads: 'file-downloads',
    form_handling: 'forms', guard: 'guard', installation: 'install', plugins: 'plugins',
    response_handling: 'request-response', routing: 'routing', sessions: 'sessions', views: 'views'
  };
  var base = 'https://nafphp.github.io/docs/';
  var seg  = (location.pathname.replace(/^\/docs\/?/, '').split('/')[0] || '');
  var to   = MAP[seg] ? base + MAP[seg] + '/' : base;
  document.getElementById('go').href = to;
  location.replace(to);
})();
</script>
</body>
</html>
